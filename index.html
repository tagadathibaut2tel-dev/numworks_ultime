<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NumWorks V18</title>
<style>
:root{--yellow:#ffb531;--dark:#414141}
*{box-sizing:border-box}
button{outline:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:Helvetica,Arial,sans-serif}
body{display:flex;justify-content:center;align-items:center;padding:10px;
  background:radial-gradient(ellipse at 50% 35%,#f7f8fa 0,#e8eaed 58%,#d9dde2 100%);
  -webkit-user-select:none;user-select:none}
#stage{position:relative;flex:none}
.nw{position:absolute;left:0;top:0;transform-origin:0 0;width:322px;
  padding:16px 32px 26px;border-radius:12px;
  background:
    radial-gradient(ellipse 80% 30% at 50% 0,#ffffff 0,#ffffff00 100%),
    linear-gradient(100deg,#f2f2f2 0%,#fdfdfd 7%,#fbfbfb 50%,#fdfdfd 93%,#efefef 100%);
  border:1px solid #dcdcdc;
  box-shadow:inset 0 2px 2px #fff,inset 0 -4px 6px #e2e2e2,inset 3px 0 4px #ffffffcc,inset -3px 0 5px #e6e6e6,
    0 1px 2px #0000001c,0 14px 30px #00000030}
.nw:before{content:"";position:absolute;inset:4px 5px;border-radius:9px;
  border:1px solid #ffffffd0;box-shadow:0 0 0 1px #00000008;pointer-events:none}
.logo{text-align:center;font-weight:700;letter-spacing:2.5px;color:#666;font-size:8px;height:11px;margin-bottom:9px}
.bez{padding:6px;border-radius:5px;
  background:linear-gradient(#dedede,#f3f3f3 30%,#f6f6f6);
  box-shadow:inset 0 2px 4px #00000040,inset 0 0 0 1px #cacaca,0 1px 0 #fff,0 -1px 0 #e8e8e8}
.scrw{width:246px;height:171px;overflow:hidden;border-radius:2px;border:1px solid #444;
  box-shadow:0 0 0 1px #8a8a8a,inset 0 0 3px #0006;background:#fff}
#scr{width:320px;height:222px;transform:scale(.76875);transform-origin:0 0;background:#fff;position:relative;overflow:hidden;
  display:flex;flex-direction:column;font-size:11px;color:var(--dark)}
.bar{height:17px;flex:none;background:var(--yellow);display:flex;justify-content:space-between;align-items:center;
  padding:0 6px;font-size:8px;font-weight:700;color:#fff}
.bar span:nth-child(2){text-transform:uppercase;letter-spacing:.5px}
.bt{width:14px;height:7px;border:1px solid #fff;border-radius:1px}
.grid{flex:1;min-height:0;overflow:hidden;position:relative;display:grid;grid-template-columns:repeat(3,1fr);
  grid-auto-rows:86px;padding:6px 10px 0 6px;align-content:start}
.sb{position:absolute;right:3px;top:23px;bottom:6px;width:3px;border-radius:2px;background:#e8e8e8}
.sb .th{position:absolute;left:0;right:0;border-radius:2px;background:#bdbdbd}
.app{display:flex;flex-direction:column;align-items:center;cursor:pointer;padding-top:4px}
.ic{width:52px;height:52px;border-radius:10px;background:linear-gradient(#f2f2f2,#e4e4e4);
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px #0002}
.ic svg{width:44px;height:44px}
.lb{font-size:8.5px;margin-top:6px;padding:1px 5px;border-radius:2px;color:#444;white-space:nowrap}
.sel .lb{background:var(--yellow);color:#fff;font-weight:700}
.body{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:4px 6px;font-family:Consolas,Menlo,monospace}
.h{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #eee;padding:1px 0}
.h b{color:#000}
.in{border-top:1px solid #ddd;padding-top:3px;min-height:16px;font-size:12px;color:#000;white-space:pre}
.cu{display:inline-block;width:1px;height:12px;background:#000;vertical-align:-2px;animation:b 1s step-end infinite}
@keyframes b{50%{opacity:0}}
.tbm{position:absolute;left:0;right:0;top:0;bottom:0;background:#fff;display:flex;flex-direction:column;z-index:5}
.tr{display:flex;justify-content:space-between;align-items:center;padding:2px 8px;font-size:10px;min-height:22px;color:#333}.tr small{display:block;font-size:8px;color:#8a8a8a;line-height:9px}.tr.sel{background:var(--yellow);color:#000}.tr.sel small{color:#6b4a00}
.f{padding:3px 8px}.f.sel{background:var(--yellow);color:#000}
canvas{width:100%;flex:1;min-height:0}

.keys{margin-top:13px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dp{position:relative;width:96px;height:96px}
.dp .cr{position:absolute;left:0;top:0;width:96px;height:96px;filter:drop-shadow(0 2px 1.5px #0000003a) drop-shadow(0 0 .6px #00000040)}
.dp .b{position:absolute;width:28px;height:28px;background:none;border:0;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.dp .b svg{width:12px;height:12px}
.u{left:34px;top:4px}.l{left:4px;top:34px}.r{right:4px;top:34px}.dn{left:34px;bottom:4px}
.l svg{transform:rotate(-90deg)}.r svg{transform:rotate(90deg)}.dn svg{transform:rotate(180deg)}
.cc{display:flex;flex-direction:column;gap:8px}
.rc{display:flex;gap:7px}
.rd{width:38px;height:30px;border-radius:16px;border:0;background:linear-gradient(#fff,#f1f1f1);
  box-shadow:0 1.5px 0 #bcbcbc,0 2.5px 4px #0003,0 0 0 .5px #d2d2d2,inset 0 1px 0 #fff;
  font:700 10px Helvetica,Arial,sans-serif;color:#333;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.rd svg{width:15px;height:15px}
.rd.hm{width:46px;height:30px;background:linear-gradient(#ffc75c,var(--yellow));box-shadow:0 1.5px 0 #c98a12,0 2.5px 4px #0003}
.rd.pw{width:46px;height:30px;background:linear-gradient(#3a3a3a,#171717);box-shadow:0 1.5px 0 #000,0 2.5px 4px #0004}
.rd:active,.k:active{transform:translateY(1.5px);box-shadow:0 0 1px #aaa}
.row{display:flex;justify-content:space-between;margin-bottom:3px}
.kw{position:relative;padding-top:9px}
.row.t6 .kw{width:38px}.row.n5 .kw{width:46px}
.row.n5{margin-bottom:5px}
.kw i{position:absolute;top:0;font:600 5.8px Helvetica,Arial,sans-serif;font-style:normal;color:#9a9a9a;line-height:8px;white-space:nowrap}
.kw i.y{left:3px;color:var(--yellow)}.kw i.g{right:3px}
.k{display:block;width:100%;height:21px;border-radius:12px;border:0;
  background:linear-gradient(#fff,#f1f1f1);
  box-shadow:0 1.5px 0 #bcbcbc,0 2.5px 3px #0002,0 0 0 .5px #d2d2d2,inset 0 1px 0 #fff;
  font:600 9px Helvetica,Arial,sans-serif;color:#333;cursor:pointer;padding:0}
.k.sh{color:var(--yellow);box-shadow:0 1.5px 0 #c98a12,0 0 0 1px var(--yellow),0 2.5px 3px #0002}
.k.sh.on{background:var(--yellow);color:#fff}
.k.n{height:27px;font-size:14px;font-weight:500;border-radius:15px}
.k.e{font-weight:700;color:#333}

.launch{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;padding:12px;text-align:center;font-family:Helvetica,Arial,sans-serif}
.launch .launch-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;background:#f0f0f0;font-size:25px;font-weight:700;color:#444}
.launch p{font-size:9px;line-height:1.4;color:#666;margin:0;max-width:210px}
.launch a{display:inline-block;padding:7px 15px;border-radius:16px;background:#ffb531;
  color:#fff;text-decoration:none;font-size:10px;font-weight:700;box-shadow:0 1.5px 0 #c98a12}
.launch .hint{font-size:8px;color:#999}

.webapp{display:flex;flex-direction:column;flex:1;min-height:0;padding:4px;gap:4px}
.webframe{width:100%;flex:1;min-height:0;border:1px solid #d4d4d4;border-radius:3px;background:#fff}
.webtools{display:flex;align-items:center;justify-content:space-between;gap:5px;font:8px Helvetica,Arial,sans-serif;color:#777}
.webtools a{color:#555;text-decoration:none;border:1px solid #ddd;border-radius:9px;padding:3px 7px;background:#fafafa}

/* Styles pour les applications web améliorées */
.search-container{display:flex;flex-direction:column;flex:1;min-height:0;padding:8px;gap:6px}
.search-bar{display:flex;gap:4px;align-items:center}
.search-input{flex:1;padding:4px 8px;border:1px solid #ccc;border-radius:12px;font-size:10px;outline:none}
.search-input:focus{border-color:var(--yellow)}
.search-btn{padding:4px 10px;background:var(--yellow);color:#fff;border:none;border-radius:12px;font-size:9px;font-weight:700;cursor:pointer}
.search-btn:hover{background:#ffa500}
.results-container{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.result-item{padding:6px;border:1px solid #e0e0e0;border-radius:6px;cursor:pointer;background:#fafafa}
.result-item:hover{background:#f0f0f0;border-color:var(--yellow)}
.result-item.selected{background:var(--yellow);color:#fff}
.result-title{font-size:9px;font-weight:700;margin-bottom:2px}
.result-desc{font-size:8px;color:#666;line-height:1.3}
.result-item.selected .result-desc{color:#fff}
.video-thumbnail{width:100%;height:80px;object-fit:cover;border-radius:4px;margin-bottom:4px}
.loading{text-align:center;padding:20px;font-size:9px;color:#999}
.error{text-align:center;padding:20px;font-size:9px;color:#d32f2f}
.wk-in{padding:3px 8px;border-bottom:1px solid #ddd;font:11px Consolas,Menlo,monospace;color:#000;min-height:18px;white-space:pre;overflow:hidden}
.wk-list{flex:1;min-height:0;overflow-y:auto;position:relative}
.wk-r{padding:3px 8px;border-bottom:1px solid #f0f0f0;cursor:pointer}.wk-r b{font-size:10px}
.wk-r small{display:block;font-size:8px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-r.sel{background:var(--yellow);color:#000}.wk-r.sel small{color:#6b4a00}
.wk-hint{padding:10px 8px;font-size:9px;color:#777;line-height:1.5}
.wk-text{flex:1;min-height:0;overflow-y:auto;padding:4px 8px;font:9px/1.4 Georgia,serif;color:#111}
.wk-text h3{margin:2px 0 4px;font-size:13px}.wk-text h4{margin:7px 0 2px;font-size:10px;border-bottom:1px solid #ddd}.wk-text p{margin:0 0 4px}
.wk-src{color:#888;font-size:8px}
.wk-r.yt{display:flex;gap:6px;align-items:center}.wk-r.yt img{width:48px;height:36px;object-fit:cover;border-radius:2px;flex:none;background:#eee}.wk-r.yt div{min-width:0}.wk-r.yt b{display:block;font-size:9px;line-height:1.2;max-height:22px;overflow:hidden}
.config-link{font-size:8px;color:#666;text-decoration:underline;cursor:pointer;text-align:center;padding:4px}
.config-link:hover{color:var(--yellow)}

/* Styles spécifiques pour Gemini */
.gemini-container{display:flex;flex-direction:column;flex:1;min-height:0;padding:8px;gap:6px}
.gemini-header{display:flex;align-items:center;gap:6px;padding:6px;background:linear-gradient(135deg,#f55036,#ff8a4c);border-radius:8px;color:#fff}
.gemini-logo{width:24px;height:24px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#f55036}
.gemini-title{font-size:11px;font-weight:700}
.gemini-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px}
.gemini-msg{padding:6px 8px;border-radius:8px;font-size:9px;line-height:1.4;max-width:85%}
.gemini-msg.user{background:#e3f2fd;align-self:flex-end}
.gemini-msg.assistant{background:#f5f5f5;align-self:flex-start}
.gemini-input-area{display:flex;gap:4px}
.gemini-input{flex:1;padding:6px 10px;border:1px solid #ccc;border-radius:16px;font-size:10px;outline:none}
.gemini-input:focus{border-color:#f55036}
.gemini-send{padding:6px 12px;background:#f55036;color:#fff;border:none;border-radius:16px;font-size:9px;font-weight:700;cursor:pointer}
.gemini-send:hover{background:#d9401f}
.gemini-send:disabled{background:#ccc;cursor:not-allowed}
</style>
</head>
<body>
<div id="stage"><div class="nw" id="nw">
<div class="logo">NUMWORKS</div>
<div class="bez"><div class="scrw"><div id="scr"></div></div></div>
<div class="keys" id="keys"></div>
</div></div>
<script>
const S={app:'home',sel:0,shift:false,ans:0,hist:[],c:{t:'',i:0},g:{t:'x',i:1},e:{t:'',i:0},s:{t:'',i:0},p:{t:'',i:0},st:[],eres:[],plot:false,zoom:10,fsel:0,files:[]};
try{S.files=JSON.parse(localStorage.getItem('nw_files')||'[]')}catch(e){}
const ic=(b,x)=>`<svg viewBox="0 0 44 44">${b?'<rect width="44" height="44" rx="6" fill="#3a3a3a"/>':''}${x}</svg>`;
const APPS=[
['calc','Calculs',ic(0,'<path d="M8 12h12M14 6v12M26 12h10M9 25l9 9M18 25l-9 9" stroke="#555" stroke-width="2.6" fill="none"/><path d="M26 27h10M26 34h10" stroke="#ffb531" stroke-width="3"/>')],
['graph','Grapheur',ic(0,'<path d="M6 38V6c3 16 12 26 32 28v4z" fill="#ffb531" opacity=".9"/><path d="M6 6v32h32" stroke="#555" stroke-width="2" fill="none"/>')],
['py','Python',ic(0,'<path d="M22 5c-9 0-8 4-8 6v4h9v2H11c-4 0-6 3-6 8s2 7 5 7h3v-5c0-3 2-5 5-5h9c2 0 4-2 4-4v-7c0-4-3-6-9-6z" fill="#3b78b0"/><path d="M22 39c9 0 8-4 8-6v-4h-9v-2h12c4 0 6-3 6-8s-2-7-5-7h-3v5c0 3-2 5-5 5h-9c-2 0-4 2-4 4v7c0 4 3 6 9 6z" fill="#ffc83d"/>')],
['stats','Statistiques',ic(0,'<rect x="5" y="22" width="10" height="16" rx="2" fill="#777"/><rect x="17" y="12" width="10" height="26" rx="2" fill="#777"/><rect x="29" y="18" width="10" height="20" rx="2" fill="#777"/>')],
['reg','Régressions',ic(0,'<path d="M6 36L38 10" stroke="#ffb531" stroke-width="3"/><circle cx="12" cy="30" r="3" fill="#555"/><circle cx="22" cy="24" r="3" fill="#555"/><circle cx="32" cy="14" r="3" fill="#555"/>')],
['seq','Suites',ic(0,'<text x="6" y="30" font-size="20" font-weight="700" fill="#555">u</text><text x="21" y="36" font-size="12" fill="#ffb531">n</text>')],
['eq','Équations',ic(1,'<circle cx="19" cy="19" r="11" fill="none" stroke="#ffb531" stroke-width="4"/><path d="M27 27l12 12" stroke="#ffb531" stroke-width="5"/><text x="11" y="24" font-size="12" font-weight="700" fill="#fff">x=</text>')],
['proba','Probabilités',ic(1,'<path d="M5 36c8 0 9-26 17-26s9 26 17 26z" fill="#ffb531"/>')],
['inf','Inférence',ic(0,'<path d="M5 36c7 0 8-24 17-24s10 24 17 24" fill="none" stroke="#777" stroke-width="3"/><path d="M14 38V20M30 38V20" stroke="#ffb531" stroke-width="3"/><path d="M14 29h16" stroke="#ffb531" stroke-width="2.5"/>')],
['fin','Finance',ic(0,'<circle cx="22" cy="22" r="16" fill="#ffb531"/><circle cx="22" cy="22" r="12" fill="none" stroke="#fff" stroke-width="1.5"/><text x="22" y="29" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">€</text>')],
['elem','Éléments',ic(1,'<rect x="8" y="8" width="28" height="28" rx="3" fill="none" stroke="#ffb531" stroke-width="2.5"/><text x="22" y="27" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Fe</text><text x="12" y="16" font-size="6" fill="#ffb531">26</text>')],
['set','Paramètres',ic(0,'<circle cx="22" cy="22" r="9" fill="none" stroke="#777" stroke-width="5" stroke-dasharray="4 3"/><circle cx="22" cy="22" r="3" fill="#ffb531"/>')],
['youtube','YouTube',ic(0,'<rect x="4" y="10" width="36" height="24" rx="7" fill="#e62117"/><path d="M19 16l11 6-11 6z" fill="#fff"/>')],
['google','Google',ic(0,'<text x="22" y="32" font-size="31" font-family="Arial" font-weight="700" text-anchor="middle" fill="#4285f4">G</text>')],
['gemini','Groq IA',ic(1,'<rect x="6" y="6" width="32" height="32" rx="9" fill="#f55036"/><text x="22" y="30" font-size="22" font-weight="700" font-family="Arial" text-anchor="middle" fill="#fff">G</text>')],
['wiki','Wikipédia',ic(0,'<text x="22" y="32" font-size="30" font-family="Georgia,serif" font-weight="700" text-anchor="middle" fill="#222">W</text>')],
['patate','Patate',ic(0,'<ellipse cx="22" cy="24" rx="16" ry="12" fill="#c8975a" transform="rotate(-15 22 24)"/><circle cx="16" cy="21" r="1.6" fill="#8a5f2d"/><circle cx="25" cy="27" r="1.6" fill="#8a5f2d"/><circle cx="28" cy="20" r="1.3" fill="#8a5f2d"/><circle cx="20" cy="28" r="1.2" fill="#8a5f2d"/>')]];

// État pour les applications web
Object.assign(S,{
  youtube:{query:'',results:[],selected:-1,loading:false,error:null,videoId:null},
  google:{query:'',results:[],selected:-1,loading:false,error:null},
  gemini:{messages:[],input:'',loading:false,error:null}
});

// Configuration des API (stockée en localStorage)
const API_CONFIG={
  youtube_mode:localStorage.getItem('nw_youtube_mode')||'invidious', // 'invidious' ou 'api'
  youtube_key:localStorage.getItem('nw_youtube_key')||'',
  invidious_instance:localStorage.getItem('nw_invidious_instance')||'https://vid.puffyan.us',
  google_mode:localStorage.getItem('nw_google_mode')||'duckduckgo', // 'duckduckgo' ou 'api'
  google_key:localStorage.getItem('nw_google_key')||'',
  google_cse:localStorage.getItem('nw_google_cse')||'',
  gemini_endpoint:localStorage.getItem('nw_gemini_endpoint')||'' // URL du backend proxy
};

function saveApiConfig(){
  localStorage.setItem('nw_youtube_mode',API_CONFIG.youtube_mode);
  localStorage.setItem('nw_youtube_key',API_CONFIG.youtube_key);
  localStorage.setItem('nw_invidious_instance',API_CONFIG.invidious_instance);
  localStorage.setItem('nw_google_mode',API_CONFIG.google_mode);
  localStorage.setItem('nw_google_key',API_CONFIG.google_key);
  localStorage.setItem('nw_google_cse',API_CONFIG.google_cse);
}

const IMPL=['calc','graph','files','stats','proba','eq','seq','reg','set','py','inf','fin','elem','youtube','google','gemini','wiki'];
Object.assign(S,{q:{t:'x^2',i:3},r:{t:'',i:0},pts:[],deg:false,ssel:0,vars:{},alpha:false,clip:'',tb:null,n:{t:'',i:0},y:{t:'',i:0},nm:-1,msel:0,nr:null,pym:'edit',pout:[],el:0});
const BUF={inf:'n',fin:'n',py:'y',calc:'c',graph:'g',eq:'e',stats:'s',proba:'p',seq:'q',reg:'r',youtube:'ytq',google:'ggq',gemini:'gemini',wiki:'wk'};
const D=x=>S.deg?x*Math.PI/180:x,U=x=>S.deg?x*180/Math.PI:x;
const T={sin:x=>Math.sin(D(x)),cos:x=>Math.cos(D(x)),tan:x=>Math.tan(D(x)),asin:x=>U(Math.asin(x)),acos:x=>U(Math.acos(x)),atan:x=>U(Math.atan(x))};
const FN={asin:'T.asin',acos:'T.acos',atan:'T.atan',sin:'T.sin',cos:'T.cos',tan:'T.tan',ln:'Math.log',log:'Math.log10',exp:'Math.exp','√':'Math.sqrt'};
Object.assign(FN,{abs:'Math.abs',floor:'Math.floor',ceil:'Math.ceil',round:'T.round',sign:'Math.sign',frac:'T.frac',root:'T.root',gcd:'T.gcd',lcm:'T.lcm',quo:'T.quo',rem:'T.rem',binomial:'T.binomial',permute:'T.permute',random:'T.random',randint:'T.randint',sinh:'Math.sinh',cosh:'Math.cosh',tanh:'Math.tanh',asinh:'Math.asinh',acosh:'Math.acosh',atanh:'Math.atanh'});
const FNRE=()=>new RegExp(Object.keys(FN).sort((a,b)=>b.length-a.length).join('|'),'g');
T.fact=x=>{if(!(x>=0)||x%1||x>170)return NaN;let r=1;for(let k=2;k<=x;k++)r*=k;return r};
Object.assign(T,{frac:x=>x-Math.floor(x),root:(x,n)=>x<0&&n%2===1?-Math.pow(-x,1/n):Math.pow(x,1/n),gcd:(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a},lcm:(a,b)=>a&&b?Math.abs(a*b)/T.gcd(a,b):0,quo:(a,b)=>Math.floor(a/b),rem:(a,b)=>a-b*Math.floor(a/b),
  binomial:(n,k)=>{if(!(k>=0&&k<=n)||n%1||k%1)return NaN;let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r)},permute:(n,k)=>{if(!(k>=0&&k<=n)||n%1||k%1)return NaN;let r=1;for(let i=0;i<k;i++)r*=n-i;return r},
  random:()=>Math.random(),randint:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),round:(x,n=0)=>Math.round(x*10**n)/10**n});
function ev(s,x){
  let t=s.replace(/Ans/g,'('+S.ans+')').replace(/e\^\(/g,'exp(').replace(/[A-Z]/g,m=>'('+(S.vars[m]||0)+')').replace(/[\[{]/g,'(').replace(/[\]}]/g,')');
  t=t.replace(/([\d.)πx])(?=\s*(?:[(π√x]|[a-z]{2,}\())/g,'$1*');

// Recherche web : outil "browser_search" des modèles gpt-oss (les modèles groq/compound ne sont pas ouverts à tous les comptes)
const WEB_SYS_END=' Termine par une ligne "Sources :" puis une source par ligne au format "- Titre | URL complète" (5 maximum).';
function parseWeb(answer,tools){
  const results=[];
  const add=(title,url,content)=>{url=(url||'').replace(/[).,;]+$/,'');if(!/^https?:\/\//.test(url)||results.some(x=>x.url===url))return;results.push({title:(title||url).replace(/[*_`#]/g,'').replace(/^[\s\-•\d.]+/,'').trim()||url,url,content:content||''})};
  (tools||[]).forEach(t=>((t.search_results&&t.search_results.results)||[]).forEach(r=>add(r.title,r.url,r.content)));
  let summary=answer,src='';
  const m=answer.match(/\n[#*\s]*sources?\s*:?[#*\s]*\n/i);
  if(m){summary=answer.slice(0,m.index);src=answer.slice(m.index+m[0].length)}
  (src||answer).split('\n').forEach(l=>{
    let any=false;
    for(const k of l.matchAll(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g)){add(k[1],k[2]);any=true}
    if(any)return;
    const u=l.match(/https?:\/\/[^\s)\]>|]+/);
    if(u)add(l.replace(u[0],'').replace(/[|—–:()\[\]\s-]+$/,'').replace(/^[\s|—–:*•\d.-]+/,''),u[0]);
  });
  summary=summary.replace(/\[([^\]]+)\]\(https?:[^)\s]+\)/g,'$1').replace(/[*#`]/g,'').trim();
  return{summary,results};
}
async function groqWeb(prompt,sys){
  if(!getGroqKey())throw new Error('Clé Groq manquante (Paramètres > Config API).');
  let err='';
  for(const model of ['openai/gpt-oss-120b','openai/gpt-oss-20b','groq/compound-mini','groq/compound']){
    const compound=model.startsWith('groq/');
    const{res,data}=await groqTry(model,[{role:'system',content:sys+WEB_SYS_END},{role:'user',content:prompt}],compound?{}:{tools:[{type:'browser_search'}],tool_choice:'required',max_tokens:3000});
    if(res.ok){
      const m=(data.choices&&data.choices[0]&&data.choices[0].message)||{};
      const p=parseWeb((m.content||'').trim(),m.executed_tools);
      if(p.summary||p.results.length)return{answer:p.summary,results:p.results};
      err='réponse vide';continue;
    }
    err=(data.error&&data.error.message)||('Erreur '+res.status);
    if(res.status===401)throw new Error('Clé Groq refusée (401).');
    if(res.status===429)throw new Error('Limite Groq atteinte (429). Réessayez dans un instant.');
  }

}

function solve(s){
  const p=s.split('='),f=x=>ev(p[0],x)-(p[1]?ev(p[1],x):0);
  const c=f(0),f1=f(1),fm=f(-1),f2=f(2);
  if([c,f1,fm,f2].some(v=>!Number.isFinite(v)))return['Erreur'];
  const a=(f1+fm)/2-c,b=(f1-fm)/2,sc=1+Math.abs(c)+Math.abs(f2);
  if(Math.abs(f2-(4*a+2*b+c))<1e-9*sc){
    if(Math.abs(a)<1e-12){if(Math.abs(b)<1e-12)return[Math.abs(c)<1e-12?'Tout réel':'Aucune solution'];return['x = '+fmt(-c/b)]}
    const D=b*b-4*a*c;
    if(D<0)return['Δ = '+fmt(D),'Pas de solution réelle'];
    if(D===0)return['Δ = 0','x = '+fmt(-b/(2*a))];
    return['Δ = '+fmt(D),'x1 = '+fmt((-b-Math.sqrt(D))/(2*a)),'x2 = '+fmt((-b+Math.sqrt(D))/(2*a))];
  }
  const r=[];let px=-100,py=f(px);
  for(let x=-99.95;x<=100&&r.length<6;x+=.05){const y=f(x);
    if(Number.isFinite(y)&&Number.isFinite(py)&&py*y<=0&&Math.abs(y-py)<50){let lo=px,hi=x;for(let k=0;k<60;k++){const m=(lo+hi)/2;f(lo)*f(m)<=0?hi=m:lo=m}
      const z=(lo+hi)/2;if(Math.abs(f(z))<1e-6&&!r.some(u=>Math.abs(u-z)<1e-6))r.push(z)}
    px=x;py=y}
  return r.length?r.map((z,i)=>'x'+(i+1)+' ≈ '+fmt(z)):['Aucune solution'];
}
function stats(a){const n=a.length;if(!n)return[];const s=a.reduce((x,y)=>x+y,0),m=s/n,v=a.reduce((x,y)=>x+(y-m)**2,0)/n,o=[...a].sort((x,y)=>x-y),md=n%2?o[(n-1)/2]:(o[n/2-1]+o[n/2])/2;
  return[['n',n],['Somme',s],['Moyenne',m],['Médiane',md],['σ',Math.sqrt(v)],['Min',o[0]],['Max',o[n-1]]]}
function binom(t){
  const [n,p,k]=t.split(',').map(v=>ev(v));
  if(![n,p,k].every(Number.isFinite)||n<0||p<0||p>1||k<0||k>n||n%1||k%1)return[['Erreur','n,p,k invalides']];
  let pk=0,c=1,cum=0,pe=0;
  for(let j=0;j<=k;j++){if(j>0)c=c*(n-j+1)/j;pk=c*p**j*(1-p)**(n-j);cum+=pk;if(j===k)pe=pk}
  return[['P(X='+k+')',pe],['P(X≤'+k+')',cum],['Moyenne',n*p],['σ',Math.sqrt(n*p*(1-p))]];
}
function reg(P){const n=P.length;if(n<2)return[];const mx=P.reduce((s,p)=>s+p[0],0)/n,my=P.reduce((s,p)=>s+p[1],0)/n;let sxy=0,sxx=0,syy=0;P.forEach(p=>{sxy+=(p[0]-mx)*(p[1]-my);sxx+=(p[0]-mx)**2;syy+=(p[1]-my)**2});

async function wikiOpen(title){

function draw(){
  const cv=document.getElementById('cv');if(!cv)return;
  const w=cv.width=cv.clientWidth*2,hh=cv.height=cv.clientHeight*2,c=cv.getContext('2d'),z=S.zoom,sx=w/(2*z),sy=sx;
  c.fillStyle='#fff';c.fillRect(0,0,w,hh);c.strokeStyle='#e5e5e5';c.lineWidth=1;
  for(let k=-Math.floor(z);k<=z;k++){c.beginPath();c.moveTo(w/2+k*sx,0);c.lineTo(w/2+k*sx,hh);c.moveTo(0,hh/2-k*sy);c.lineTo(w,hh/2-k*sy);c.stroke()}
  c.strokeStyle='#333';c.lineWidth=2;c.beginPath();c.moveTo(0,hh/2);c.lineTo(w,hh/2);c.moveTo(w/2,0);c.lineTo(w/2,hh);c.stroke();
  c.strokeStyle='#d6336c';c.lineWidth=3;c.beginPath();let pen=false,py=0;
  for(let px=0;px<=w;px+=2){const x=(px-w/2)/sx,y=ev(S.g.t,x);
    if(!Number.isFinite(y)||Math.abs(y)>1e4){pen=false;continue}
    const yy=hh/2-y*sy;if(pen&&Math.abs(yy-py)<hh)c.lineTo(px,yy);else c.moveTo(px,yy);pen=true;py=yy}
  c.stroke();
}

 `<div class="nav"><div class="dp"><svg class="cr" viewBox="0 0 96 96"><defs><linearGradient id="cg" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ececec"/></linearGradient></defs><path d="M38 9H58V38H87V58H58V87H38V58H9V38H38Z" fill="url(#cg)" stroke="url(#cg)" stroke-width="14" stroke-linejoin="round"/></svg><button class="b u" data-a="UP">${ARW}</button><button class="b l" data-a="LEFT">${ARW}</button><button class="b r" data-a="RIGHT">${ARW}</button><button class="b dn" data-a="DOWN">${ARW}</button></div><div class="cc"><button class="rd hm" data-a="HOME">${I_HOME}</button><button class="rd pw" data-a="">${I_PWR}</button></div><div class="rc"><button class="rd" data-a="OK">OK</button><button class="rd" data-a="BACK">${I_BACK}</button></div></div>`+
 ROWS.map(r=>`<div class="row ${r.length===6?'t6':'n5'}">`+r.map(k=>`<div class="kw">${tops(k[3])}<button class="k ${k[2]}" data-a="${at(k[1])}" data-s="${at(k[4])}" data-l="${at(k[5])}">${k[0]}</button></div>`).join('')+'</div>').join('');
document.getElementById('keys').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.a)press(b.dataset.a,{s:b.dataset.s,l:b.dataset.l})};
document.addEventListener('keydown',e=>{
  if(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  const m={ArrowUp:'UP',ArrowDown:'DOWN',ArrowLeft:'LEFT',ArrowRight:'RIGHT',Enter:'EXE',Backspace:'DEL',Escape:'HOME','*':'×','/':'÷','-':'−','^':'^','=':'='};
  if(((S.app==='py'&&(S.pym==='edit'||(S.pym==='out'&&!S.prun&&!(S.pcv&&S.pshow==='cv'))))||(S.app==='wiki'&&S.wiki.view==='list')||(S.app==='youtube'&&S.youtube.view==='list')||(S.app==='google'&&S.google.view==='list'))&&!e.ctrlKey&&!e.metaKey&&!e.altKey){if(e.key==='Tab'){e.preventDefault();return press('    ')}if(e.key.length===1){e.preventDefault();return press(e.key)}}
  const a=m[e.key]||(/^[0-9+().,]$/.test(e.key)?e.key:e.key==='x'?'x':e.key==='p'?'π':'');
  if(a){e.preventDefault();press(a)}
});
render();
function fit(){
  const nw=document.getElementById('nw'),st=document.getElementById('stage');
  const w=nw.offsetWidth,h=nw.offsetHeight;
  const s=Math.max(.5,Math.min(1.7,(innerHeight-20)/h,(innerWidth-20)/w));
  nw.style.transform='scale('+s+')';st.style.width=(w*s)+'px';st.style.height=(h*s)+'px';
}
addEventListener('resize',fit);fit();homeScroll();
</script>
